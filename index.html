<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Festa na Cidade</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0f0a1a; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const EVENTOS = [
  { id:1, nome:"Noite de Kizomba", local:"Talatona, Luanda", data:"16 Ago", hora:"22:00",
    categoria:"Música", preco:2500, img:"linear-gradient(135deg,#ff6b6b,#c724b1)" },
  { id:2, nome:"Festival Semba na Rua", local:"Ilha de Luanda", data:"22 Ago", hora:"18:00",
    categoria:"Festival", preco:5000, img:"linear-gradient(135deg,#f9a826,#ff5858)" },
  { id:3, nome:"Torneio de Basquete 3x3", local:"Cidadela, Luanda", data:"20 Ago", hora:"09:00",
    categoria:"Desporto", preco:1000, img:"linear-gradient(135deg,#26c6da,#2952e3)" },
  { id:4, nome:"Stand-up Comedy Night", local:"Miramar, Luanda", data:"18 Ago", hora:"20:30",
    categoria:"Lazer", preco:3000, img:"linear-gradient(135deg,#7b2ff7,#f107a3)" },
];

function Header({ tab, setTab }) {
  return (
    <div className="sticky top-0 z-20 bg-[#0f0a1a]/95 backdrop-blur border-b border-white/10 px-4 pt-4 pb-2">
      <div className="flex items-center justify-between mb-3">
        <h1 className="text-xl font-bold text-white">🎉 Festa na Cidade</h1>
      </div>
      <div className="flex gap-2 overflow-x-auto pb-1">
        {[
          ["explorar","Explorar"],["carteira","Carteira"],
          ["organizador","Organizador"],["perfil","Perfil"]
        ].map(([key,label])=>(
          <button key={key} onClick={()=>setTab(key)}
            className={`px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition ${
              tab===key ? "bg-gradient-to-r from-pink-600 to-orange-500 text-white"
                        : "bg-white/5 text-white/60"}`}>
            {label}
          </button>
        ))}
      </div>
    </div>
  );
}

function EventoCard({ ev, onClick }) {
  return (
    <div onClick={onClick}
      className="rounded-2xl overflow-hidden bg-white/5 border border-white/10 mb-4 active:scale-[0.98] transition">
      <div className="h-32" style={{background: ev.img}} />
      <div className="p-3">
        <div className="flex justify-between items-start">
          <h3 className="text-white font-semibold text-base">{ev.nome}</h3>
          <span className="text-xs bg-white/10 text-white/70 px-2 py-0.5 rounded-full">{ev.categoria}</span>
        </div>
        <p className="text-white/50 text-sm mt-1">📍 {ev.local}</p>
        <p className="text-white/50 text-sm">📅 {ev.data} · {ev.hora}</p>
        <p className="text-orange-400 font-bold mt-2">{ev.preco.toLocaleString()} Kz</p>
      </div>
    </div>
  );
}

function DetalheEvento({ ev, onVoltar, onComprar }) {
  return (
    <div className="px-4 pb-24">
      <button onClick={onVoltar} className="text-white/60 mb-3">← Voltar</button>
      <div className="h-48 rounded-2xl mb-4" style={{background: ev.img}} />
      <h2 className="text-white text-2xl font-bold">{ev.nome}</h2>
      <p className="text-white/50 mt-1">📍 {ev.local}</p>
      <p className="text-white/50">📅 {ev.data} · {ev.hora}</p>
      <p className="text-orange-400 text-xl font-bold mt-3">{ev.preco.toLocaleString()} Kz</p>
      <button onClick={onComprar}
        className="w-full mt-6 py-3 rounded-xl bg-gradient-to-r from-pink-600 to-orange-500 text-white font-semibold">
        Comprar Bilhete
      </button>
    </div>
  );
}

function Pagamento({ ev, onConfirmar, onVoltar }) {
  const [nome, setNome] = useState("");
  const [tel, setTel] = useState("");
  return (
    <div className="px-4 pb-24">
      <button onClick={onVoltar} className="text-white/60 mb-3">← Voltar</button>
      <h2 className="text-white text-lg font-bold mb-4">Pagamento via Multicaixa Express</h2>
      <div className="bg-white/5 rounded-xl p-4 mb-4 border border-white/10">
        <p className="text-white/70 text-sm">Evento: <span className="text-white">{ev.nome}</span></p>
        <p className="text-white/70 text-sm">Valor: <span className="text-orange-400 font-bold">{ev.preco.toLocaleString()} Kz</span></p>
      </div>
      <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Nome completo"
        className="w-full mb-3 p-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30" />
      <input value={tel} onChange={e=>setTel(e.target.value)} placeholder="Número Multicaixa Express"
        className="w-full mb-3 p-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30" />
      <p className="text-white/40 text-xs mb-4">Após confirmar, o bilhete fica pendente até o organizador validar a transferência.</p>
      <button disabled={!nome || !tel} onClick={()=>onConfirmar(nome, tel)}
        className="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-orange-500 text-white font-semibold disabled:opacity-40">
        Confirmar Pagamento
      </button>
    </div>
  );
}

function Carteira({ bilhetes }) {
  if (bilhetes.length === 0)
    return <p className="text-white/40 text-center mt-10 px-4">Ainda não tem bilhetes. Explore eventos para comprar!</p>;
  return (
    <div className="px-4 pb-24">
      {bilhetes.map((b,i)=>(
        <div key={i} className="bg-white/5 border border-white/10 rounded-2xl p-4 mb-3">
          <div className="flex justify-between items-center">
            <h3 className="text-white font-semibold">{b.ev.nome}</h3>
            <span className={`text-xs px-2 py-0.5 rounded-full ${
              b.estado==="pendente" ? "bg-yellow-500/20 text-yellow-400" : "bg-green-500/20 text-green-400"}`}>
              {b.estado}
            </span>
          </div>
          <p className="text-white/50 text-sm mt-1">📅 {b.ev.data} · {b.ev.hora}</p>
          <p className="text-white/50 text-sm">🎫 Código: {b.codigo}</p>
          <p className="text-white/50 text-sm">👤 {b.nome}</p>
        </div>
      ))}
    </div>
  );
}

function Organizador() {
  return (
    <div className="px-4 pb-24">
      <h2 className="text-white text-lg font-bold mb-4">Modo Organizador</h2>
      <div className="bg-white/5 border border-white/10 rounded-2xl p-4 mb-4">
        <p className="text-white/60 text-sm mb-3">Crie o seu evento e comece a vender bilhetes.</p>
        <button className="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-orange-500 text-white font-semibold">
          + Criar Novo Evento
        </button>
      </div>
      <div className="bg-white/5 border border-white/10 rounded-2xl p-4">
        <p className="text-white font-semibold mb-1">Bilhetes pendentes</p>
        <p className="text-white/40 text-sm">Confirme pagamentos recebidos via Multicaixa Express para liberar os bilhetes dos compradores.</p>
      </div>
    </div>
  );
}

function Perfil() {
  return (
    <div className="px-4 pb-24 text-center mt-6">
      <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-r from-pink-600 to-orange-500 flex items-center justify-center text-2xl text-white font-bold mb-3">
        M
      </div>
      <h2 className="text-white font-bold text-lg">Morais</h2>
      <p className="text-white/40 text-sm mb-6">morais@example.com</p>
      <div className="bg-white/5 border border-white/10 rounded-2xl divide-y divide-white/10 text-left">
        {["Meus dados","Métodos de pagamento","Ativar modo organizador","Suporte","Sair"].map((item,i)=>(
          <div key={i} className="p-4 text-white/80">{item}</div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("explorar");
  const [eventoSel, setEventoSel] = useState(null);
  const [pagando, setPagando] = useState(false);
  const [bilhetes, setBilhetes] = useState([]);

  const confirmarPagamento = (nome, tel) => {
    const codigo = "FC-" + Math.random().toString(36).slice(2,8).toUpperCase();
    setBilhetes([...bilhetes, { ev: eventoSel, nome, tel, codigo, estado:"pendente" }]);
    setPagando(false);
    setEventoSel(null);
    setTab("carteira");
  };

  let conteudo;
  if (eventoSel && pagando) {
    conteudo = <Pagamento ev={eventoSel} onVoltar={()=>setPagando(false)} onConfirmar={confirmarPagamento} />;
  } else if (eventoSel) {
    conteudo = <DetalheEvento ev={eventoSel} onVoltar={()=>setEventoSel(null)} onComprar={()=>setPagando(true)} />;
  } else if (tab === "explorar") {
    conteudo = (
      <div className="px-4 pb-24 pt-2">
        {EVENTOS.map(ev => <EventoCard key={ev.id} ev={ev} onClick={()=>setEventoSel(ev)} />)}
      </div>
    );
  } else if (tab === "carteira") {
    conteudo = <Carteira bilhetes={bilhetes} />;
  } else if (tab === "organizador") {
    conteudo = <Organizador />;
  } else {
    conteudo = <Perfil />;
  }

  return (
    <div className="min-h-screen">
      <Header tab={eventoSel ? "" : tab} setTab={(t)=>{ setEventoSel(null); setPagando(false); setTab(t); }} />
      {conteudo}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
